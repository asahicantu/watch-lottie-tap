<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>

<body>
  <x-dc>
    <helmet>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
          min-height: 100vh;
          padding: 40px 20px;
        }

        .container {
          max-width: 1400px;
          margin: 0 auto;
        }

        .header {
          text-align: center;
          margin-bottom: 50px;
        }

        .header h1 {
          font-size: 48px;
          font-weight: 700;
          color: #1a1a1a;
          margin-bottom: 12px;
          letter-spacing: -0.5px;
        }

        .header p {
          font-size: 18px;
          color: #666;
          font-weight: 400;
        }

        .controls {
          display: flex;
          gap: 12px;
          justify-content: center;
          margin-bottom: 30px;
          flex-wrap: wrap;
        }

        button {
          padding: 10px 20px;
          border: none;
          border-radius: 8px;
          font-size: 14px;
          font-weight: 500;
          cursor: pointer;
          transition: all 0.2s ease;
        }

        .btn-primary {
          background: #2563eb;
          color: white;
        }

        .btn-primary:hover {
          background: #1d4ed8;
          transform: translateY(-1px);
          box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
          background: white;
          color: #1a1a1a;
          border: 1px solid #ddd;
        }

        .btn-secondary:hover {
          background: #f9f9f9;
          border-color: #bbb;
        }

        .btn-secondary.active {
          background: #2563eb;
          color: white;
          border-color: #2563eb;
        }

        .gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 24px;
        }

        .card {
          background: white;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
          transition: all 0.3s ease;
          cursor: pointer;
        }

        .card:hover {
          transform: translateY(-4px);
          box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .card-animation {
          width: 100%;
          aspect-ratio: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
        }

        .card-info {
          padding: 16px;
        }

        .card-name {
          font-size: 16px;
          font-weight: 600;
          color: #1a1a1a;
          text-transform: capitalize;
          margin-bottom: 8px;
        }

        .card-meta {
          font-size: 12px;
          color: #5f5f5f;
        }

        .lottie-container {
          width: 100%;
          height: 100%;
        }

        .card[data-selected="true"] {
          box-shadow: 0 0 0 2px #2563eb, 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .overlay {
          position: fixed;
          inset: 0;
          background: rgba(20, 18, 17, 0.55);
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          z-index: 50;
        }

        .sheet {
          background: white;
          border-radius: 16px;
          width: 100%;
          max-width: 460px;
          overflow: hidden;
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        }

        .sheet-stage {
          aspect-ratio: 1;
          background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
        }

        .sheet-body {
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .sheet-head {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 12px;
        }

        .sheet-title {
          font-size: 22px;
          font-weight: 600;
          color: #1a1a1a;
          text-transform: capitalize;
        }

        .sheet-frame {
          font-size: 13px;
          color: #5f5f5f;
          font-variant-numeric: tabular-nums;
        }

        .sheet-row {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .scrub {
          flex: 1;
          accent-color: #2563eb;
        }
      </style>
    </helmet>

    <div class="container">
      <div class="header">
        <h1>Animal Animations</h1>
        <p>30 smooth Lottie animations showcasing delightful character movements</p>
      </div>

      <div class="controls">
        <button class="btn-primary" onClick="{{ playAll }}">Play All</button>
        <button class="btn-secondary" onClick="{{ pauseAll }}">Pause</button>
        <button class="btn-secondary" onClick="{{ resetAll }}">Reset</button>
        <button class="btn-secondary" onClick="{{ toggleAutoplay }}" id="autoplayBtn">Autoplay: ON</button>
      </div>

      <div class="gallery">
        <sc-for list="{{ cards }}" as="card" hint-placeholder-count="6">
          <div class="card" onClick="{{ selectAnimal }}" data-animal="{{ card.name }}"
            data-selected="{{ card.selected }}">
            <div class="card-animation" id="anim-{{ card.name }}">
              <div class="lottie-container"></div>
            </div>
            <div class="card-info">
              <div class="card-name">{{ card.name }}</div>
              <div class="card-meta">{{ card.beat }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{ selected }}" hint-placeholder-val="{{ false }}">
      <div class="overlay" onClick="{{ closeDetail }}">
        <div class="sheet" onClick="{{ stopBubble }}">
          <div class="sheet-stage" id="detail-stage"></div>
          <div class="sheet-body">
            <div class="sheet-head">
              <div class="sheet-title">{{ selected }}</div>
              <div class="sheet-frame">{{ frameLabel }}</div>
            </div>
            <div class="sheet-row">
              <button class="btn-primary" onClick="{{ toggleDetail }}">{{ detailLabel }}</button>
              <input class="scrub" type="range" min="0" max="90" step="1" value="{{ frame }}" onChange="{{ scrub }}"
                onInput="{{ scrub }}">
            </div>
            <div class="sheet-row">
              <button class="btn-secondary" onClick="{{ closeDetail }}">Close</button>
              <span class="card-meta">300×300 · 90 frames · 30fps · seamless loop</span>
            </div>
          </div>
        </div>
      </div>
    </sc-if>
    </helmet>
  </x-dc>
  <script type="text/x-dc" data-dc-script
    data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100vh&quot;}}">
class Component extends DCLogic {
  state = {
    animals: ["bear", "bee", "cat", "cow", "crocodile", "dog", "donkey", "duck", "elephant", "fox", "frog", "giraffe", "goat", "hippo", "horse", "koala", "lion", "monkey", "mouse", "owl", "panda", "parrot", "penguin", "pig", "rabbit", "rooster", "sheep", "snake", "tiger", "wolf"],
    animations: {},
    autoplay: true,
    selectedAnimal: null,
    frame: 0,
    detailPlaying: true
  };

  componentDidMount() {
    this.loadAnimations();
  }

  loadAnimations = () => {
    const { animals } = this.state;
    const animations = {};

    animals.forEach(animal => {
      const container = document.getElementById(`anim-${animal}`);
      if (!container) return;

      fetch(`./uploads/animations/${animal}.json`)
        .then(res => res.json())
        .then(data => {
          const lottieContainer = container.querySelector('.lottie-container');
          const anim = lottie.loadAnimation({
            container: lottieContainer,
            renderer: 'svg',
            loop: true,
            autoplay: this.state.autoplay,
            animationData: data,
            rendererSettings: {
              preserveAspectRatio: 'xMidYMid meet',
              clearCanvas: false
            }
          });
          animations[animal] = anim;
          this.setState({ animations });
        })
        .catch(err => console.error(`Failed to load ${animal}:`, err));
    });
  };

  playAll = () => {
    Object.values(this.state.animations).forEach(anim => {
      if (anim && anim.play) anim.play();
    });
  };

  pauseAll = () => {
    Object.values(this.state.animations).forEach(anim => {
      if (anim && anim.pause) anim.pause();
    });
  };

  resetAll = () => {
    Object.values(this.state.animations).forEach(anim => {
      if (anim && anim.goToAndPlay) {
        anim.goToAndPlay(0, true);
      }
    });
  };

  toggleAutoplay = () => {
    this.setState(s => ({
      autoplay: !s.autoplay
    }), () => {
      const btn = document.getElementById('autoplayBtn');
      if (btn) {
        btn.textContent = `Autoplay: ${this.state.autoplay ? 'ON' : 'OFF'}`;
      }
      Object.values(this.state.animations).forEach(anim => {
        if (anim) {
          anim.pause();
          if (this.state.autoplay) {
            anim.play();
          }
        }
      });
    });
  };

  // bob rate tuned per species when the Lottie files were reworked
  BEATS = {
    koala:1, cow:1, crocodile:1, snake:1, elephant:1, hippo:1, giraffe:1,
    mouse:3, bee:3, rabbit:3, parrot:3, duck:3, frog:3, monkey:3, rooster:3
  };

  selectAnimal = (e) => {
    const animal = e.currentTarget.getAttribute('data-animal');
    this.setState({ selectedAnimal: animal, frame: 0, detailPlaying: true });
  };

  stopBubble = (e) => { e.stopPropagation(); };

  closeDetail = () => {
    if (this.detailAnim) { this.detailAnim.destroy(); this.detailAnim = null; }
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
    this.setState({ selectedAnimal: null });
  };

  componentDidUpdate(prevProps, prevState) {
    if (prevState.selectedAnimal === this.state.selectedAnimal) return;
    if (this.detailAnim) { this.detailAnim.destroy(); this.detailAnim = null; }
    const name = this.state.selectedAnimal;
    if (!name) return;
    const host = document.getElementById('detail-stage');
    if (!host) return;
    fetch(`./uploads/animations/${name}.json`)
      .then(r => r.json())
      .then(data => {
        if (this.state.selectedAnimal !== name) return;
        this.detailAnim = lottie.loadAnimation({
          container: host, renderer: 'svg', loop: true, autoplay: true,
          animationData: data,
          rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
        });
        this.trackFrame();
      })
      .catch(err => console.error(`detail load failed for ${name}:`, err));
  }

  trackFrame = () => {
    const tick = () => {
      if (!this.detailAnim || !this.state.selectedAnimal) return;
      const f = Math.round(this.detailAnim.currentFrame);
      if (f !== this.state.frame) this.setState({ frame: f });
      this.rafId = requestAnimationFrame(tick);
    };
    this.rafId = requestAnimationFrame(tick);
  };

  toggleDetail = () => {
    if (!this.detailAnim) return;
    const playing = !this.state.detailPlaying;
    if (playing) { this.detailAnim.play(); this.trackFrame(); }
    else { this.detailAnim.pause(); if (this.rafId) cancelAnimationFrame(this.rafId); }
    this.setState({ detailPlaying: playing });
  };

  scrub = (e) => {
    const f = Number(e.target.value);
    if (this.detailAnim) this.detailAnim.goToAndStop(f, true);
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
    this.setState({ frame: f, detailPlaying: false });
  };

  componentWillUnmount() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    if (this.detailAnim) this.detailAnim.destroy();
  }

  renderVals() {
    const sel = this.state.selectedAnimal;
    const frame = this.state.frame || 0;
    return {
      cards: this.state.animals.map(name => ({
        name,
        selected: sel === name ? 'true' : 'false',
        beat: `${this.BEATS[name] || 2} bob${(this.BEATS[name] || 2) > 1 ? 's' : ''} / loop · 90f · 30fps`
      })),
      selected: sel,
      frame,
      frameLabel: `frame ${String(frame).padStart(2, '0')} / 90`,
      detailLabel: this.state.detailPlaying ? 'Pause' : 'Play',
      playAll: this.playAll,
      pauseAll: this.pauseAll,
      resetAll: this.resetAll,
      toggleAutoplay: this.toggleAutoplay,
      selectAnimal: this.selectAnimal,
      closeDetail: this.closeDetail,
      toggleDetail: this.toggleDetail,
      stopBubble: this.stopBubble,
      scrub: this.scrub
    };
  }
}

</script>
</body>

</html>
