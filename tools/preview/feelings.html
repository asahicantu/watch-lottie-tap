<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Feelings Lottie preview</title>
<script src="lottie.min.js"></script>
<style>
  body { background:#101216; color:#e9edf2; font:14px system-ui, sans-serif; margin:16px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; }
  .cell { background:#000; border-radius:50%; aspect-ratio:1; position:relative;
          display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .cell > div { width:100%; height:100%; }
  .name { text-align:center; margin-top:6px; letter-spacing:.04em; }
  .err { color:#ff6b6b; font-size:11px; }
  h1 { font-size:16px; font-weight:600; }
</style>
</head>
<body>
<h1>Feelings — bundled Lottie assets</h1>
<div class="grid" id="grid"></div>
<script>
const names = ["happy", "sad", "angry", "scared", "surprised", "disgusted", "calm", "excited", "tired", "proud", "embarrassed", "confused", "jealous", "grateful", "lonely", "hopeful", "nervous", "bored", "curious", "loving"];
const grid = document.getElementById("grid");
window.__errors = [];
names.forEach(n => {
  const wrap = document.createElement("div");
  const cell = document.createElement("div");
  cell.className = "cell";
  const host = document.createElement("div");
  cell.appendChild(host);
  const label = document.createElement("div");
  label.className = "name";
  label.textContent = n;
  wrap.appendChild(cell); wrap.appendChild(label);
  grid.appendChild(wrap);
  try {
    const anim = lottie.loadAnimation({
      container: host, renderer: "svg", loop: true, autoplay: true,
      path: "/app/src/main/assets/animations/feelings/" + n + ".json"
    });
    anim.addEventListener("data_failed", () => {
      window.__errors.push(n + ": data_failed");
      label.innerHTML = n + ' <span class="err">FAILED</span>';
    });
  } catch (e) {
    window.__errors.push(n + ": " + e.message);
  }
});
window.__seek = (f) => lottie.freeze() || null;
window.__goto = (frame) => { lottie.unfreeze(); };
</script>
</body>
</html>
